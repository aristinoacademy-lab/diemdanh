<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Aristino Academy Check-in</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
</head>
<body class="bg-gradient-to-br from-slate-950 via-slate-900 to-indigo-950 text-white min-h-screen flex items-center justify-center p-4 antialiased selection:bg-amber-500 selection:text-slate-900">

  <script>
    const CONFIG_API_URL = "https://script.google.com/macros/s/AKfycbxKgyscXtBC3JdYbgyQ-mPxhNVNnnvgVNaNmxHRIJnhT6_HCzxXDkMtuTPO8Uuff1O7/exec";
  </script>

  <div id="form-card" class="bg-slate-900/80 backdrop-blur-xl p-8 rounded-3xl shadow-2xl w-full max-w-sm border border-slate-800/80 text-center animate__animated animate__fadeInUp">
    <div class="mb-6">
      <div class="inline-flex bg-gradient-to-r from-amber-500 to-amber-600 text-slate-950 text-xs font-black px-4 py-1.5 rounded-full uppercase tracking-widest shadow-md shadow-amber-500/10 mb-4">ARISTINO ACADEMY</div>
      <h2 id="class-title" class="text-xl font-black text-amber-400 leading-snug tracking-tight">Đang đồng bộ lớp học...</h2>
      <p id="class-teacher" class="text-xs text-slate-400 mt-1 font-medium"></p>
    </div>

    <div class="space-y-5">
      <div class="relative">
        <label class="block text-left text-xs font-bold text-slate-400 uppercase tracking-wider mb-2 ml-1">Mã Nhân Sự Của Bạn</label>
        <input type="text" id="input-maNV" placeholder="VD: ARIS09" class="w-full bg-slate-950/60 border-2 border-slate-800 focus:border-amber-400 rounded-2xl px-4 py-4 text-center text-2xl font-black tracking-widest text-amber-300 focus:outline-none transition-all duration-300 uppercase shadow-inner">
      </div>
      
      <button onclick="executeCheckIn()" id="btn-action" class="w-full bg-gradient-to-r from-amber-500 to-amber-600 hover:from-amber-400 hover:to-amber-500 text-slate-950 font-black py-4 rounded-2xl transition duration-300 transform active:scale-98 shadow-xl shadow-amber-500/10 hover:shadow-amber-500/20 text-md cursor-pointer tracking-wide">
        XÁC NHẬN ĐIỂM DANH
      </button>
    </div>
  </div>

  <div id="wow-card" class="hidden bg-slate-900/90 backdrop-blur-xl p-8 rounded-3xl shadow-2xl w-full max-w-sm border-2 border-emerald-500/50 text-center animate__animated animate__zoomIn">
    <div class="w-20 h-20 bg-gradient-to-tr from-emerald-500 to-teal-400 text-slate-950 rounded-full flex items-center justify-center mx-auto text-4xl font-bold mb-5 shadow-lg shadow-emerald-500/30">✓</div>
    <h2 class="text-2xl font-black tracking-tight text-emerald-400">CHECK-IN THÀNH CÔNG!</h2>
    <h1 id="user-welcome" class="text-xl font-bold text-white mt-4 bg-slate-950/50 py-3 px-4 rounded-xl border border-slate-800"></h1>
    <p id="class-slogan" class="text-sm italic text-slate-400 mt-6 border-t border-slate-800/80 pt-4 leading-relaxed"></p>
  </div>

  <script>
    window.onload = async function() {
  try {
    let res = await fetch(CONFIG_API_URL);
    let config = await res.json();
    // Đồng bộ chữ viết thường để triệt tiêu lỗi hiển thị
    document.getElementById('class-title').innerText = config.ten_lop || "Chưa có tên lớp";
    document.getElementById('class-teacher').innerText = "Giảng viên: " + (config.giang_vien || "Chưa rõ");
    document.getElementById('class-slogan').innerText = config.slogan ? `"${config.slogan}"` : '"Chúc bạn học tập tốt!"';
  } catch(e) {
    document.getElementById('class-title').innerText = "Lỗi kết nối dữ liệu!";
  }
};

    async function executeCheckIn() {
      const input = document.getElementById('input-maNV');
      const btn = document.getElementById('btn-action');
      const maNV = input.value.trim();
      
      if(!maNV) { alert('Vui lòng nhập Mã nhân sự!'); return; }
      
      btn.innerText = "HỆ THỐNG ĐANG GHI NHẬN...";
      btn.disabled = true;
      
      try {
        let response = await fetch(`${CONFIG_API_URL}?action=checkIn&maNV=${encodeURIComponent(maNV)}`, { method: 'POST' });
        let result = await response.json();
        
        if(result.status === "SUCCESS" || result.status === "OUTSIDER") {
          // BẮN PHÁO HOA TRẢI NGHIỆM WOW TỨC THÌ
          var duration = 3 * 1000;
          var end = Date.now() + duration;
          (function frame() {
            confetti({ particleCount: 5, angle: 60, spread: 55, origin: { x: 0 }, colors: ['#f59e0b', '#10b981', '#3b82f6'] });
            confetti({ particleCount: 5, angle: 120, spread: 55, origin: { x: 1 }, colors: ['#f59e0b', '#10b981', '#3b82f6'] });
            if (Date.now() < end) { requestAnimationFrame(frame); }
          }());

          document.getElementById('form-card').classList.add('hidden');
          document.getElementById('wow-card').classList.remove('hidden');
          document.getElementById('user-welcome').innerText = "Xin chào: " + result.hoTen;
        } else {
          alert(result.message);
          btn.innerText = "XÁC NHẬN ĐIỂM DANH";
          btn.disabled = false;
        }
      } catch(err) {
        alert("Nghẽn mạng cục bộ, vui lòng bấm lại!");
        btn.innerText = "XÁC NHẬN ĐIỂM DANH";
        btn.disabled = false;
      }
    }
  </script>
</body>
</html>
